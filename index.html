<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Videos</title>

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #0078d4;
    margin-bottom: 30px;
}

.video-card {
    background: white;
    padding: 20px;
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.video-card h2 {
    margin-top: 0;
    color: #333;
}

.watch-button {
    display: inline-block;
    background: #0078d4;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 6px;
    font-weight: bold;
}

.watch-button:hover {
    background: #005fa3;
}

video {
    width: 100%;
    border-radius: 8px;
    margin-top: 10px;
}

.chapters {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 15px;
}

.chapter {
    width: 220px;
    cursor: pointer;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    background: white;
    transition: transform 0.2s;
}

    transform: scale(1.03);
}
